[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["extension", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests hold literal URLs and messages that read better on one line.
"training/tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["training/tests"]
