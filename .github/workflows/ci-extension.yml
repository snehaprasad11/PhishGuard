name: extension

# Typechecks, lints, unit-tests and builds the extension, runs it in a real
# browser, and uploads the packaged build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Includes the parity test against Python's features, the ONNX model run in
      # ONNX Runtime Web, and the manifest / source privacy audit.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install the test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (built extension in Chromium)
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Package
        run: cd dist && zip -r ../phishguard-extension.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: phishguard-extension
          path: extension/phishguard-extension.zip

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: extension/test-results
