name: drift

# Weekly: compare today's phishing reports with what the model was trained on.
# Opens an issue when the shape of phishing URLs, or the model's scores on
# them, has shifted enough to justify retraining. No user data is involved:
# the extension sends nothing, so drift is watched from public feeds.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.lock

      - name: Install dependencies
        run: pip install -r training/requirements.lock

      # Exit status: 0 no alert, 2 drift alert, 3 feed unavailable (rate limited).
      - name: Drift report against the live feed
        id: drift
        env:
          # Optional. Without a key PhishTank rate-limits downloads.
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
        run: |
          set +e
          python -m training.drift --live
          status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::The live feed could not be downloaded, so no drift report was produced."
            echo "status=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          # Soon after a retrain there is too little new phishing to judge: no report is written.
          if [ ! -f training/artifacts/drift-report.md ]; then
            echo "::notice::Too few new phishing reports since the training snapshot for a drift report."
            echo "status=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat training/artifacts/drift-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: steps.drift.outputs.status == '0' || steps.drift.outputs.status == '2'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            training/artifacts/drift-report.md
            training/artifacts/drift.json

      - name: Open an issue on a drift alert
        if: steps.drift.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Drift alert: phishing has shifted since the model was trained" \
            --body-file training/artifacts/drift-report.md
